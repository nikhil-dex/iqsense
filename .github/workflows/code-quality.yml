#Goal : I have to do SAST for my code

name: Code Quality

on:
    workflow_call: 

jobs:
    sast:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: frontend/           package-lock.json
                      
            - name: Install npm packages
              working-directory: ./frontend
              run: npm ci
                  
            - name: Run linters
              working-directory: ./frontend
              run: npm run lint