# Goal: To ensure no secrets have been leaked in the code

name: Secrets Scanning

on:
    workflow_call:

permissions:
  contents: read

jobs:
    scan-secrets:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
                submodules: true

            - name: Gitleaks Scanner #gitleaks is a sast tool to check for secrets in the code
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #already present in github actions, no need to create a new token AND we should not use on pull request because it will not have access to secrets in the repo