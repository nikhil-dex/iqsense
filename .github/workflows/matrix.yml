
name: matrix1

on:
    workflow_dispatch:
    
jobs:
    linter:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false #after fail it run for next node version if set true it will stop at first fail
            matrix:
                node-version: [18, 20]
        steps:
          - name: Checkout code
            uses: actions/checkout@v7
            with:
              submodules: true
    
          - name: Setup Node.js
            uses: actions/setup-node@v7
            with:
              node-version: ${{matrix.node-version}}
              cache: npm
              cache-dependency-path: frontend/package-lock.json
            
    
          - name: Install npm packages
            working-directory: ./frontend
            run: npm ci
            
            
          - name: Run linters
            working-directory: ./frontend
            run: npm run lint
              
          - name: Run tests
            working-directory: ./frontend
            run: npm run test